
name: MLOps Training Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "dvc[gs]==3.67.1"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: mlops-arwa-fall2026
          workload_identity_provider: projects/704937435550/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: google-service-account@mlops-arwa-fall2026.iam.gserviceaccount.com

      - name: Download dataset with DVC
        run: dvc pull data/raw.dvc

      - name: Reproduce ML experiment
        run: dvc repro --force

      - name: Display evaluation metrics
        run: cat evaluation/metrics.json

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: ml-evaluation-results
          path: |
            evaluation/metrics.json
            evaluation/plots/
          retention-days: 7
