name: MLOps Training Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "dvc[gs]==3.67.1"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: mlops-arwa-fall2026
          workload_identity_provider: projects/704937435550/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: google-service-account@mlops-arwa-fall2026.iam.gserviceaccount.com

      - name: Download dataset with DVC
        run: dvc pull data/raw.dvc

      - name: Reproduce ML experiment
        run: dvc repro --force

      - name: Display evaluation metrics
        run: cat evaluation/metrics.json

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: ml-evaluation-results
          path: |
            evaluation/metrics.json
            evaluation/plots/
          retention-days: 7

      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2
        with:
          version: '0.20.6'
          vega: false

      
      # Generate all six comparison images
      - name: Generate DVC comparison plots
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:refs/heads/main
          dvc plots diff main

          mkdir -p comparison-plots

          cp dvc_plots/static/{main,workspace}_evaluation_plots_{training_history,pred_preview,confusion_matrix}.png comparison-plots/

          echo "Generated comparison images:"
          ls -lh comparison-plots/

      # Make plots available for download on GitHub
      - name: Upload comparison plots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ml-comparison-plots
          path: comparison-plots/
          if-no-files-found: error
          retention-days: 7

      # Publish the working CML report
      - name: Create CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# MLOps Experiment Report" > report.md

          echo "## Parameters vs main" >> report.md
          dvc params diff main --md >> report.md

          echo "## Metrics vs main" >> report.md
          dvc metrics diff main --md >> report.md

          echo "## Current Evaluation Metrics" >> report.md
          echo '```json' >> report.md
          cat evaluation/metrics.json >> report.md
          echo '```' >> report.md

          echo "## Model Comparison Plots" >> report.md
          echo "The artifact contains six PNG images:" >> report.md
          echo "- Training History: main vs workspace" >> report.md
          echo "- Predictions Preview: main vs workspace" >> report.md
          echo "- Confusion Matrix: main vs workspace" >> report.md

          echo "" >> report.md
          echo "[View and download comparison plots](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> report.md

          cml comment update --target=pr --publish=false report.md
