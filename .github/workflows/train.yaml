name: MLOps Training Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "dvc[gs]==3.67.1"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: mlops-arwa-fall2026
          workload_identity_provider: projects/704937435550/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: google-service-account@mlops-arwa-fall2026.iam.gserviceaccount.com

      - name: Download dataset with DVC
        run: dvc pull data/raw.dvc

      - name: Reproduce ML experiment
        run: dvc repro --force

      - name: Display evaluation metrics
        run: cat evaluation/metrics.json

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: ml-evaluation-results
          path: |
            evaluation/metrics.json
            evaluation/plots/
          retention-days: 7

      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2
        with:
          version: '0.20.6'
          vega: false

      - name: Create CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch main branch locally for comparisons
          git fetch --depth=1 origin main:main

          # Create DVC comparison plots
          dvc plots diff main

          # Detect actual filenames created by DVC
          MAIN_PREFIX="main"
          WORK_PREFIX="workspace"

          if [ -f dvc_plots/static/origin_main_evaluation_plots_training_history.png ]; then
            MAIN_PREFIX="origin_main"
          fi

          if [ -f dvc_plots/static/HEAD_evaluation_plots_training_history.png ]; then
            WORK_PREFIX="HEAD"
          fi

          # Start report
          {
            echo "# MLOps Experiment Report"
            echo
            echo "## Parameters vs main"
            dvc params diff main --md || true
            echo
            echo "## Metrics vs main"
            dvc metrics diff main --md || true
            echo
            echo "## Current Evaluation Metrics"
            echo '```json'
            cat evaluation/metrics.json
            echo '```'
            echo
          } > report.md

          publish_plot_pair() {
            TITLE="$1"
            BASENAME="$2"

            echo "## ${TITLE}" >> report.md
            echo >> report.md

            echo "### Main branch" >> report.md
            cml publish "dvc_plots/static/${MAIN_PREFIX}_evaluation_plots_${BASENAME}.png" --md >> report.md
            echo >> report.md

            echo "### New experiment" >> report.md
            cml publish "dvc_plots/static/${WORK_PREFIX}_evaluation_plots_${BASENAME}.png" --md >> report.md
            echo >> report.md
          }

          publish_plot_pair "Training History" "training_history"
          publish_plot_pair "Predictions Preview" "pred_preview"
          publish_plot_pair "Confusion Matrix" "confusion_matrix"

          # Publish PR comment
          cml comment update --target=pr report.md