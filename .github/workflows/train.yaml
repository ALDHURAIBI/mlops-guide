
name: MLOps Training Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "dvc[gs]==3.67.1"

      # Step 4: Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: mlops-arwa-fall2026
          workload_identity_provider: projects/704937435550/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: google-service-account@mlops-arwa-fall2026.iam.gserviceaccount.com

      # Step 5: Download dataset using DVC
      - name: Download dataset with DVC
        run: dvc pull data/raw.dvc

      # Step 6: Reproduce ML experiment
      - name: Reproduce ML experiment
        run: dvc repro --force

      # Step 7: Display evaluation metrics
      - name: Display evaluation metrics
        run: cat evaluation/metrics.json

      # Step 8: Upload evaluation results
      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: ml-evaluation-results
          path: |
            evaluation/metrics.json
            evaluation/plots/
          retention-days: 7

      # Step 9: Install CML for pull requests
      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2
        with:
          version: '0.20.6'
          vega: false

      # Step 10: Generate and publish CML report

      - name: Create CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main:refs/heads/main

          echo "# MLOps Experiment Report" > report.md
          echo "" >> report.md

          echo "## Parameters vs main" >> report.md
          dvc params diff main --md >> report.md

          echo "" >> report.md
          echo "## Metrics vs main" >> report.md
          dvc metrics diff main --md >> report.md

          echo "" >> report.md
          echo "## Current Evaluation Metrics" >> report.md
          echo '```json' >> report.md
          cat evaluation/metrics.json >> report.md
          echo '```' >> report.md

          cml comment update \
            --target=pr \
            --publish=false \
            --repo=https://github.com/ALDHURAIBI/mlops-guide \
            report.md
